<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title data-resource="appName"></title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/icons.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="notifBlock" aria-live="polite"></div>
<div id="notifBlock2" aria-hidden="true"></div>

<button class="burger" type="button" aria-label="Меню"><span class="i i-menu"></span></button>

<nav class="sidebar">
    <div class="logo">
        <img src="../../assets/images/logo.svg" alt="">
        <span class="logo-name">VoteFlow</span>
    </div>
    <div class="navigation">
        <button class="tablinks" id="addTab" data-tab="append" type="button">
            <span class="i i-plus"></span>
            <div data-resource="addButton"></div>
        </button>
        <button class="tablinks" id="addedTab" data-tab="added" type="button">
            <span class="i i-list"></span>
            <div data-resource="addedButton"></div>
            <span class="nav-count" id="navProjectsCount"></span>
        </button>
        <button class="tablinks" id="settingsTab" data-tab="settings" type="button">
            <span class="i i-sliders"></span>
            <div data-resource="optionsButton"></div>
        </button>
        <button class="tablinks" id="helpTab" data-tab="help" type="button">
            <span class="i i-info"></span>
            <div data-resource="help"></div>
        </button>
    </div>
    <div class="nav-foot">
        <span id="navVersion" class="mono"></span>
    </div>
</nav>

<main class="container">
    <a id="updateBanner" class="update-banner" target="_blank" hidden>
        <span class="i i-download"></span>
        <span class="update-text"></span>
    </a>
    <!-- Добавить -->
    <section id="append" class="tabcontent" style="display: none;">
        <header class="page-head">
            <div>
                <h1 data-resource="addTitle"></h1>
                <div class="editSubtitle" style="display: none;"></div>
            </div>
        </header>
        <div id="welcome" class="card welcome" style="display: none">
            <h2 class="card-title" data-resource="welcomeTitle"></h2>
            <ol class="steps">
                <li><span class="step-num mono">1</span><div><b data-resource="welcomeStep1"></b><span class="hint" data-resource="welcomeStep1Hint"></span></div></li>
                <li><span class="step-num mono">2</span><div><b data-resource="welcomeStep2"></b><span class="hint" data-resource="welcomeStep2Hint"></span></div></li>
                <li><span class="step-num mono">3</span><div><b data-resource="welcomeStep3"></b><span class="hint" data-resource="welcomeStep3Hint"></span></div></li>
            </ol>
        </div>
        <form id="addProject" class="addProject addProjectExpertManual">
            <div id="emptyDiv"></div>
            <div class="card form-main">
                <div class="mode-row">
                    <input type="checkbox" name="switchAddMode" id="switchAddMode" class="switchAddMode checkbox">
                    <label for="switchAddMode" data-resource="switchAddMode">
                        <span class="hint"><span data-resource="switchAddModeHint"></span></span>
                    </label>
                </div>
                <!--Ссылка-->
                <div class="input-block">
                    <label data-resource="link" for="link"></label>
                    <input class="input" name="link" id="link" required placeholder="linkPlaceholder" type="text"
                           spellcheck="false" autocomplete="off">
                    <div id="linkStatus" class="field-status" aria-live="polite"></div>
                </div>
                <!--Выбор сайта-->
                <div style="display: none;" class="input-block">
                    <label data-resource="siteTop" for="rating"></label>
                    <input class="input" name="project" type="text" id="rating" placeholder="selectTop"
                           list="ratingList" spellcheck="false" autocomplete="off">
                    <datalist id="ratingList"></datalist>
                </div>
                <!--Никнейм-->
                <div class="input-block" style="display: none">
                    <label data-resource="yourNick" for="nick"></label>
                    <input class="input" name="nick" id="nick" placeholder="enterNick" type="text" spellcheck="false">
                </div>
                <!--ID проекта-->
                <div style="display: none;" class="input-block">
                    <label for="id" data-resource="projectID">
                        <span class="hint">
                            <span data-resource="projectIDTooltip"></span>
                            <span class="example"><span id="projectIDTooltip1"></span><span id="projectIDTooltip2" class="hl"></span><span id="projectIDTooltip3"></span></span>
                        </span>
                    </label>
                    <input class="input" name="id" id="id" placeholder="inputProjectID" type="text" spellcheck="false">
                </div>
                <!--Дополнительные параметры URL-->
                <div style="display: none;" class="input-block">
                    <label data-resource="additionURL" for="additionURL">
                        <span class="hint">
                            <span class="example"><span id="additionURLTooltip1"></span><span id="additionURLTooltip2" class="hl"></span><span id="additionURLTooltip3"></span></span>
                        </span>
                    </label>
                    <input id="additionURL" name="additionURL" placeholder="additionURL" type="text" class="input"
                           spellcheck="false"/>
                </div>
                <!--Выбор игры-->
                <div style="display: none;" class="input-block">
                    <label data-resource="urlGame" for="chooseGame">
                        <span class="hint">
                            <span data-resource="gameIDTooltip"></span>
                            <span class="example"><span id="urlGameTooltip1"></span><span id="urlGameTooltip2" class="hl"></span><span id="urlGameTooltip3"></span></span>
                        </span>
                    </label>
                    <input class="input" name="chooseGame" type="text" id="chooseGame" placeholder="chooseGameURL"
                           list="gameList" spellcheck="false" autocomplete="off">
                    <datalist id="gameList"></datalist>
                </div>
                <!--Выбор списка (например, у Discord: боты, серверы)-->
                <div style="display: none;" class="input-block">
                    <label data-resource="urlListing" for="chooseListing">
                        <span class="hint">
                            <span data-resource="listingIDTooltip"></span>
                            <span class="example"><span id="urlListingTooltip1"></span><span id="urlListingTooltip2" class="hl"></span><span id="urlListingTooltip3"></span></span>
                        </span>
                    </label>
                    <input class="input" name="chooseListing" type="text" id="chooseListing"
                           placeholder="chooseListingURL" list="listingList" spellcheck="false" autocomplete="off">
                    <datalist id="listingList"></datalist>
                </div>
                <!--Выбор языка-->
                <div style="display: none;" class="input-block">
                    <label data-resource="chooseLang" for="chooseLang"></label>
                    <input class="input" name="chooseLang" type="text" id="chooseLang" placeholder="chooseLang"
                           list="langList" spellcheck="false" autocomplete="off">
                    <datalist id="langList"></datalist>
                </div>
                <!--Максимальное кол-во голосов в день-->
                <div style="display: none;" class="input-block">
                    <label for="countVote" data-resource="countVote"></label>
                    <input id="countVote" name="countVote" type="number" min="1" max="16" placeholder="countVote"
                           class="input" value="5">
                </div>
                <!--Порядковый номер мира-->
                <div style="display: none;" class="input-block">
                    <label for="ordinalWorld" data-resource="ordinalWorld">
                        <span class="hint"><span data-resource="ordinalWorldTooltip"></span></span>
                    </label>
                    <input id="ordinalWorld" name="ordinalWorld" type="number" min="1" max="16"
                           placeholder="ordinalWorld" class="input">
                </div>
                <!--Тип таймаута-->
                <div style="display: none;" class="input-block">
                    <label for="selectTime" data-resource="selectTime"></label>
                    <select required id="selectTime" class="select">
                        <option value="ms" data-resource="timeoutMS"></option>
                        <option value="hour" data-resource="timeoutHour"></option>
                        <option value="week" data-resource="timeoutWeek"></option>
                        <option value="month" data-resource="timeoutMonth"></option>
                    </select>
                </div>
                <!--Задержка в миллисекундах-->
                <div style="display: none;" class="input-block">
                    <label for="time" data-resource="delayFetch"></label>
                    <input id="time" name="customTime" placeholder="delayFetch" type="number" min="10000"
                           class="input"/>
                </div>
                <!--Час-->
                <div style="display: none;" class="input-block">
                    <label for="hour" data-resource="chooseHour"></label>
                    <input id="hour" name="chooseHour" placeholder="chooseHour" type="time" step="0.001" min="0"
                           max="23" class="input"/>
                </div>
                <!--День недели-->
                <div style="display: none;" class="input-block">
                    <label for="week" data-resource="chooseWeek"></label>
                    <select required id="week" class="select">
                        <option value="1" data-resource="monday"></option>
                        <option value="2" data-resource="tuesday"></option>
                        <option value="3" data-resource="wednesday"></option>
                        <option value="4" data-resource="thursday"></option>
                        <option value="5" data-resource="friday"></option>
                        <option value="6" data-resource="saturday"></option>
                        <option value="0" data-resource="sunday"></option>
                    </select>
                </div>
                <!--Число месяца-->
                <div style="display: none;" class="input-block">
                    <label for="month" data-resource="chooseMonth"></label>
                    <input id="month" name="chooseMonth" placeholder="chooseMonth" type="number" min="1" max="31"
                           class="input"/>
                </div>
                <!--Запланировать голосование-->
                <div style="display: none;" class="input-block">
                    <label for="scheduleTime" data-resource="scheduleTime"></label>
                    <input id="scheduleTime" type="datetime-local" class="input" step="0.001">
                </div>
                <!--Рандомизация голосования-->
                <div style="display: none;" class="input-block input-pair">
                    <label for="randomizeMin" data-resource="randomizeInput"></label>
                    <input id="randomizeMin" type="number" class="input mono" placeholder="min">
                    <input id="randomizeMax" type="number" class="input mono" placeholder="max">
                </div>
                <!--URL запроса-->
                <div style="display: none;" class="input-block">
                    <label for="responseURL" data-resource="urlFetch"></label>
                    <input id="responseURL" name="customURL" placeholder="urlFetch" type="text" class="input"
                           spellcheck="false"/>
                </div>
                <!--Тело запроса-->
                <div style="display: none;" class="input-block">
                    <label for="customBody" data-resource="bodyFetch"></label>
                    <textarea id="customBody" name="customBody" placeholder="bodyFetch" class="textarea mono"
                              spellcheck="false"></textarea>
                </div>
                <!--Режим голосования (тихий или эмуляция)-->
                <div style="display: none;" class="input-block">
                    <label for="voteModeSelect" data-resource="enabledSilentVote">
                        <span class="hint"><span data-resource="enabledSilentVoteTooltip"></span></span>
                    </label>
                    <select id="voteModeSelect" class="select">
                        <option data-resource="enabledSilentVoteSilent" value="silentMode"></option>
                        <option data-resource="enabledSilentVoteNoSilent" value="emulateMode"></option>
                    </select>
                </div>

                <div data-resource="banAttention" id="banAttention" class="callout warn" style="display: none"></div>
                <div data-resource="rewardAttention" id="rewardAttention" class="callout" style="display: none"></div>
                <div data-resource="operaAttention" id="operaAttention" class="callout warn" style="display: none">
                    <a class="link" target="_blank"
                       href="https://github.com/Serega007RU/Auto-Vote-Rating/wiki/Problems-with-Opera">Problems with Opera</a>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary submitBtn" data-resource="addButton" id="submitAddProject" type="submit"></button>
                    <div class="editProjectButtons" style="display: none;">
                        <button class="btn btn-primary submitBtn" data-resource="save" id="submitEditProject" type="submit"></button>
                        <button class="btn submitBtn" data-resource="cancel" id="submitCancelProject" type="button"></button>
                    </div>
                </div>
            </div>
            <div id="advSettingsAdd" class="card" style="display: none">
                <h2 class="card-title" data-resource="advSettings"></h2>
                <div class="check-block">
                    <input class="checkbox" id="customTimeOut" type="checkbox" name="customTimeOut"/>
                    <label data-resource="customTimeOut" for="customTimeOut"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="lastDayMonth" type="checkbox" name="lastDayMonth" disabled/>
                    <label data-resource="lastDayMonth" for="lastDayMonth"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="scheduleTimeCheckbox" type="checkbox" name="scheduleTimeCheckbox"/>
                    <label data-resource="scheduleTime" for="scheduleTimeCheckbox"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disableCheckProjects" type="checkbox" name="disableCheckProjects"/>
                    <label data-resource="disableCheckProjects" for="disableCheckProjects"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="priority" type="checkbox" name="priority"/>
                    <label data-resource="priority" for="priority">
                        <span class="hint"><span data-resource="priorityTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="randomize" type="checkbox" name="randomize"/>
                    <label data-resource="randomize" for="randomize">
                        <span class="hint"><span data-resource="randomizeTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="voteMode" type="checkbox" name="voteMode" disabled/>
                    <label data-resource="voteMode" for="voteMode"></label>
                </div>
            </div>
        </form>
        <details id="supportedSites" class="card sites-card">
            <summary><span data-resource="supportedSites"></span> <span id="sitesCount" class="mono muted"></span></summary>
            <div class="sites-body">
                <input id="sitesFilter" class="input" type="search" placeholder="sitesFilter" spellcheck="false" autocomplete="off">
                <div id="sitesList" class="sites-list"></div>
            </div>
        </details>
    </section>

    <!-- Опции -->
    <section id="settings" class="tabcontent" style="display: none;">
        <header class="page-head">
            <div><h1 data-resource="optionsExtension"></h1></div>
        </header>
        <div class="userSettings">
            <div class="card">
                <h2 class="card-title" data-resource="groupNotifications"></h2>
                <div class="check-block">
                    <input class="checkbox" id="disabledNotifStart" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingNotifStart" for="disabledNotifStart"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledNotifInfo" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingNotifInfo" for="disabledNotifInfo"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledNotifWarn" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingNotifWarn" for="disabledNotifWarn">
                        <span class="hint"><span data-resource="disabledNotifWarnTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledNotifError" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingNotifError" for="disabledNotifError"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledWarnCaptcha" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingWarnCaptcha" for="disabledWarnCaptcha">
                        <span class="hint"><span data-resource="settingWarnCaptchaHint"></span></span>
                    </label>
                </div>
                <h2 class="card-title card-subtitle" data-resource="groupVoting"></h2>
                <div class="check-block">
                    <input class="checkbox" id="disabledFocusedTab" type="checkbox" name="checkbox"/>
                    <label data-resource="settingFocusedTab" for="disabledFocusedTab">
                        <span class="hint"><span data-resource="disabledFocusedTabTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledClickCaptcha" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingClickCaptcha" for="disabledClickCaptcha">
                        <span class="hint"><span data-resource="settingClickCaptchaHint"></span></span>
                    </label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledRestartOnTimeout" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingRestartOnTimeout" for="disabledRestartOnTimeout"></label>
                </div>
                <div class="check-block">
                    <input class="checkbox" id="disabledCheckInternet" type="checkbox" name="checkbox" data-invert="true"/>
                    <label data-resource="settingCheckInternet" for="disabledCheckInternet">
                        <span class="hint"><span data-resource="settingCheckInternetHint"></span></span>
                    </label>
                </div>
                <h2 class="card-title card-subtitle" data-resource="groupAdvanced"></h2>
                <div class="check-block">
                    <input class="checkbox" id="expertMode" type="checkbox" name="checkbox"/>
                    <label data-resource="expertMode" for="expertMode">
                        <span class="hint"><span data-resource="expertModeTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block" style="display: none">
                    <input class="checkbox" id="disabledOneVote" type="checkbox" name="checkbox"/>
                    <label data-resource="disabledOneVote" for="disabledOneVote"></label>
                </div>
                <div class="check-block" style="display: none">
                    <input class="checkbox" id="disabledDebug" type="checkbox" name="checkbox"/>
                    <label data-resource="disabledDebug" for="disabledDebug">
                        <span class="hint"><span data-resource="debugTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block" style="display: none">
                    <input class="checkbox" id="disableCloseTabsOnSuccess" type="checkbox" name="checkbox"/>
                    <label data-resource="disableCloseTabsOnSuccess" for="disableCloseTabsOnSuccess">
                        <span class="hint"><span data-resource="debugTooltip"></span></span>
                    </label>
                </div>
                <div class="check-block" style="display: none">
                    <input class="checkbox" id="disableCloseTabsOnError" type="checkbox" name="checkbox"/>
                    <label data-resource="disableCloseTabsOnError" for="disableCloseTabsOnError">
                        <span class="hint"><span data-resource="debugTooltip"></span></span>
                    </label>
                </div>
            </div>

            <div class="settings-side">
                <div class="card timeouts-card">
                    <div class="input-block" style="display: none">
                        <label data-resource="cooldown" for="timeoutValue">
                            <span class="hint"><span data-resource="timeoutTooltip"></span></span>
                        </label>
                        <form id="timeout" class="inline-form">
                            <input class="input mono" name="cooldown" id="timeoutValue" required type="number" min="0">
                            <button data-resource="setCooldown" type="submit" class="btn justBtn"></button>
                        </form>
                    </div>
                    <div class="input-block" style="display: none">
                        <label data-resource="cooldownError" for="timeoutErrorValue">
                            <span class="hint"><span data-resource="timeoutErrorTooltip"></span></span>
                        </label>
                        <form id="timeoutError" class="inline-form">
                            <input class="input mono" name="cooldownError" id="timeoutErrorValue" required type="number" min="0">
                            <button data-resource="setCooldown" type="submit" class="btn justBtn"></button>
                        </form>
                    </div>
                    <div class="input-block" style="display: none">
                        <label data-resource="cooldownVote" for="timeoutVoteValue">
                            <span class="hint"><span data-resource="timeoutVoteTooltip"></span></span>
                        </label>
                        <form id="timeoutVote" class="inline-form">
                            <input class="input mono" name="cooldownVote" id="timeoutVoteValue" required type="number"
                                   min="1000">
                            <button data-resource="setCooldown" type="submit" class="btn justBtn"></button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card-title" data-resource="settingsFile"></h2>
                    <div class="fileSystem">
                        <label for="file-upload" class="file" tabindex="0">
                            <span class="i i-upload"></span>
                            <span data-resource="importSettings"></span>
                        </label>
                        <input id="file-upload" type="file" accept="application/json"/>
                        <button id="file-download" class="file" type="button">
                            <span class="i i-download"></span>
                            <span data-resource="exportSettings"></span>
                        </button>
                        <button id="logs-download" class="file" type="button">
                            <span class="i i-file"></span>
                            <span data-resource="exportLogs"></span>
                        </button>
                        <button id="logs-clear" class="file" type="button">
                            <span class="i i-eraser"></span>
                            <span data-resource="clearLogs"></span>
                        </button>
                    </div>
                    <div id="storageUsed" class="mono"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Добавленные -->
    <section id="added" class="tabcontent" style="display: none;">
        <header class="page-head">
            <div><h1 data-resource="addedButton"></h1></div>
            <div class="head-actions">
                <button id="todayStats" class="btn" type="button">
                    <span class="i i-clock"></span><span data-resource="todayStats"></span>
                </button>
                <button id="generalStats" class="btn" type="button">
                    <span class="i i-stats"></span><span data-resource="generalStats"></span>
                </button>
            </div>
        </header>
        <p id="addedLoading" class="muted" data-resource="load"></p>
        <div class="empty-wrap">
            <p id="notAddedAll" class="empty" data-resource="notAddedAll" style="display: none;"></p>
            <button id="emptyAddButton" class="btn btn-primary" type="button"><span class="i i-plus"></span><span data-resource="addProjectButton"></span></button>
        </div>
        <div class="projectsBlock">
            <div class="buttonBlock"></div>
            <div class="contentBlock"></div>
        </div>
    </section>

    <!-- О расширении -->
    <section id="help" class="tabcontent" style="display: none;">
        <header class="page-head">
            <div><h1 data-resource="help"></h1></div>
        </header>
        <div class="aboutProject">
            <div class="card about-main">
                <div class="about-brand">
                    <img src="../../assets/images/logo.svg" alt="">
                    <div>
                        <div class="about-name">VoteFlow</div>
                        <div data-resource="version" class="version mono"></div>
                    </div>
                </div>
                <p class="about-desc" data-resource="appDesc"></p>
                <div class="about-links">
                    <a class="btn" target="_blank" href="https://github.com/BazZziliuS/VoteFlow">
                        <span class="i i-github"></span><span>GitHub</span>
                    </a>
                    <a class="btn" target="_blank" href="https://github.com/BazZziliuS/VoteFlow/issues">
                        <span class="i i-alert"></span><span>Issues</span>
                    </a>
                    <a class="btn" target="_blank" href="https://discord.gg/GyvMtbU">
                        <span class="i i-message"></span><span>Discord</span>
                    </a>
                </div>
                <div class="free muted" data-resource="itsFree"></div>
            </div>

            <div class="card cont">
                <h2 class="card-title" data-resource="developers"></h2>
                <dl class="credits">
                    <div data-resource="maintainer">
                        <a class="link" target="_blank" href="https://github.com/BazZziliuS">BazZziliuS</a>
                    </div>
                    <div data-resource="originalAuthor">
                        <a class="link" target="_blank" href="https://github.com/Serega007RU">Serega007</a>
                    </div>
                    <div data-resource="designer">
                        <a class="link" target="_blank" href="https://discord.com/users/279936883277168640">Qworte</a>
                    </div>
                    <div data-resource="translated"></div>
                </dl>
                <div class="basedOn muted" data-resource="basedOn">
                    <a class="link" target="_blank" href="https://github.com/Serega007RU/Auto-Vote-Rating">Serega007RU/Auto-Vote-Rating</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Загрузка -->
    <div id="load" style="display: flex;">
        <span class="spinner"></span>
        <div>Loading...</div>
    </div>
</main>

<!-- Модалки -->
<div id="modals">
    <div class="overlay"></div>
    <!-- Быстрое добавление -->
    <div class="modal" id="addFastProject" role="dialog" aria-modal="true">
        <div class="head">
            <h3 data-resource="fastAdd"></h3>
            <button class="close" type="button" aria-label="Закрыть"><span class="i i-x"></span></button>
        </div>
        <div class="content">
            <div class="message"></div>
            <div class="events"></div>
        </div>
    </div>
    <div class="modal" id="loading">
        <span class="spinner"></span>
    </div>
    <!-- Неподдерживаемый браузер -->
    <div class="modal notSupportedBrowser" id="notSupportedBrowser" role="dialog" aria-modal="true">
        <div class="head">
            <h3 data-resource="notSupportedBrowser"></h3>
        </div>
        <div class="content">
            <div class="message">
                <p data-resource="notSupportedBrowserContent1"></p>
                <p data-resource="notSupportedBrowserContent2"></p>
            </div>
            <div class="events">
                <button class="btn" data-resource="deleteExtension" type="button"></button>
                <button class="btn redBtn" data-resource="limitedModeButton1" type="button"></button>
            </div>
        </div>
    </div>
    <!-- Неподдерживаемый браузер 2 -->
    <div class="modal notSupportedBrowser" id="notSupportedBrowser2" role="dialog" aria-modal="true">
        <div class="head">
            <h3 data-resource="areYouSure"></h3>
            <button class="close" type="button" aria-label="Закрыть"><span class="i i-x"></span></button>
        </div>
        <div class="content">
            <div class="message">
                <p data-resource="limitedModeContent"></p>
                <p>
                    <span data-resource="limitedModeContent3"></span>
                    <a class="link" target="_blank"
                       href="https://github.com/Serega007RU/Auto-Vote-Rating/wiki/Problems-with-Opera">Problems with Opera</a>
                </p>
                <p data-resource="limitedModeContent1"></p>
                <p data-resource="limitedModeContent2"></p>
            </div>
            <div class="events">
                <button class="btn" data-resource="deleteExtension" type="button"></button>
                <button class="btn redBtn" data-resource="limitedModeButton2" type="button" disabled></button>
            </div>
        </div>
    </div>
    <!-- Статистика -->
    <div class="modal stats-modal" id="stats" role="dialog" aria-modal="true">
        <div class="head">
            <div class="title">
                <h3 data-resource="stats2"></h3>
                <div class="statsSubtitle"></div>
            </div>
            <button class="close" type="button" aria-label="Закрыть"><span class="i i-x"></span></button>
        </div>
        <div class="content">
            <div class="message">
                <table>
                    <tbody>
                    <tr class="tile">
                        <td data-resource="statsSuccessVotes"></td>
                        <th></th>
                    </tr>
                    <tr class="tile">
                        <td data-resource="statsMonthSuccessVotes"></td>
                        <th></th>
                    </tr>
                    <tr class="tile">
                        <td data-resource="statsLastMonthSuccessVotes"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsLaterVotes"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsErrorVotes"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsLastSuccessVote"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsLastAttemptVote"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsAdded"></td>
                        <th></th>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Статистика за сегодня -->
    <div class="modal stats-modal" id="statsToday" role="dialog" aria-modal="true">
        <div class="head">
            <div class="title">
                <h3 data-resource="stats2"></h3>
                <div class="statsSubtitle" data-resource="todayStats"></div>
            </div>
            <button class="close" type="button" aria-label="Закрыть"><span class="i i-x"></span></button>
        </div>
        <div class="content">
            <div class="message">
                <table>
                    <tbody>
                    <tr class="tile">
                        <td data-resource="statsSuccessVotes"></td>
                        <th></th>
                    </tr>
                    <tr class="tile">
                        <td data-resource="statsLaterVotes"></td>
                        <th></th>
                    </tr>
                    <tr class="tile">
                        <td data-resource="statsErrorVotes"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsLastSuccessVote"></td>
                        <th></th>
                    </tr>
                    <tr>
                        <td data-resource="statsLastAttemptVote"></td>
                        <th></th>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
