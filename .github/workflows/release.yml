name: Create Release

on:
  push:
    tags:
      - 'v*'  # Триггерится на теги вида v7.2.6, v7.3.0 и т.д.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v7.2.6)'
        required: true
        type: string

jobs:
  release:
    name: Create Release with Extension Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # нужна история и теги для changelog

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Package extension
        run: |
          # Создаём временную директорию для сборки
          mkdir -p build/VoteFlow

          # Копируем все необходимые файлы
          cp -r src build/VoteFlow/
          cp -r libs build/VoteFlow/
          cp -r images build/VoteFlow/
          cp -r _locales build/VoteFlow/
          cp -r css build/VoteFlow/
          cp -r fonts build/VoteFlow/
          cp manifest.json build/VoteFlow/
          cp README.md build/VoteFlow/
          cp PRIVACY.md build/VoteFlow/
          cp THIRD_PARTY_NOTICES.md build/VoteFlow/
          cp LICENSE build/VoteFlow/

          # Переходим в директорию build и создаём архив
          cd build
          zip -r VoteFlow-${{ steps.get_version.outputs.version }}.zip VoteFlow

          # Показываем размер архива
          ls -lh VoteFlow-${{ steps.get_version.outputs.version }}.zip

      - name: Generate changelog
        id: changelog
        run: |
          # Если для версии есть заметки docs/releases/<версия>.md — используем их
          NOTES="docs/releases/${{ steps.get_version.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" changelog.txt
            echo "Using $NOTES"
            exit 0
          fi

          # Иначе собираем changelog из коммитов с предыдущего тега
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          # Сохраняем в файл для использования в release
          echo "$CHANGELOG" > changelog.txt

          echo "Changelog generated"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: VoteFlow ${{ steps.get_version.outputs.version }}
          body_path: changelog.txt
          files: |
            build/VoteFlow-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.get_tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`VoteFlow-${{ steps.get_version.outputs.version }}.zip\` from the release" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the archive" >> $GITHUB_STEP_SUMMARY
          echo "3. Open \`chrome://extensions/\` in your browser" >> $GITHUB_STEP_SUMMARY
          echo "4. Enable 'Developer mode'" >> $GITHUB_STEP_SUMMARY
          echo "5. Click 'Load unpacked' and select the extracted \`VoteFlow\` folder" >> $GITHUB_STEP_SUMMARY
