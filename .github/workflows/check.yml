name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Integrity check (paths, site scripts, locales)
        run: node scripts/check-manifest.js

      - name: Unit tests (site configs, vote time, cooldown parsing)
        run: npm test

      - name: Options page smoke test (headless Chrome)
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
