name: Новый сайт
description: Предложить сайт-рейтинг для поддержки
title: "feat(<домен>): поддержка сайта"
labels: [new site]
body:
  - type: input
    id: url
    attributes:
      label: Ссылка на страницу голосования
      placeholder: https://example.com/server/12345/vote
    validations:
      required: true
  - type: dropdown
    id: captcha
    attributes:
      label: Капча
      options: [Нет, reCAPTCHA, hCaptcha, Yandex SmartCaptcha, Cloudflare Turnstile, Другая, Не знаю]
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: Нужен вход на сайт
      options: [Нет, ВКонтакте, Discord, Steam, Свой аккаунт, Не знаю]
  - type: input
    id: cooldown
    attributes:
      label: Как часто можно голосовать
      placeholder: раз в 24 часа, в полночь по МСК
  - type: textarea
    id: details
    attributes:
      label: Как проходит голосование
      description: Какие кнопки нажимать, что нужно ввести (ник), как сайт сообщает об успехе
